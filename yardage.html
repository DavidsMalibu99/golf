<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5130">
<title>Green Yardages</title>
<style>
/* Layout: one-screen GPS view — yardage column left, drawn hole right, hole bar along the bottom */
:root {
  --green: #1f5130;
  --green-2: #2d6a41;
  --green-tint: #e8f1eb;
  --sand: #f6f4ee;
  --ink: #1c2320;
  --muted: #5d6963;
  --line: #dde3df;
  --card: #ffffff;
  --trees: #1f3f26;
  --canopy: #2c5a34;
  --canopy-2: #173320;
  --native: #9a9a6a;      /* out-of-play rough: pale olive, like the aerials */
  --native-2: #8b8f5e;
  --dirt: #b39a72;
  --shade: #1c2b26;
  --rough: #5b9a45;
  --stripe: #66a750;
  --putting: #8fd47a;
  --putting-edge: #c9efb9;
  --water: #3d7fae;
  --water-edge: #8cc0de;
  --bunker: #f1e6c8;
  --bunker-edge: #d4c194;
  --chip: #13261a;
  --you: #2b8ae6;
  --flag: #d2342b;
  --ok: #2d8a4e; --fair: #c58a10; --poor: #b3261e;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--sand); color: var(--ink); }
body { margin: 0; font: 16px/1.35 var(--font); }
.app { height: 100%; display: flex; flex-direction: column; }

.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--green); color: #fff; }
.views { flex: 1; display: grid; grid-template-columns: 1fr 1fr; background: rgba(0,0,0,.25); border-radius: 10px; padding: 3px; max-width: 360px; margin-inline: auto; }
.views button { height: 36px; border: 0; border-radius: 8px; background: transparent; color: #fff; font: 600 16px var(--font); cursor: pointer; }
.views button[aria-pressed="true"] { background: #fff; color: var(--green); }
.views button:disabled { opacity: .45; cursor: not-allowed; }

.body { flex: 1; min-height: 0; display: flex; }
.col { flex: 0 0 128px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 12px 8px 12px 16px; background: var(--card); border-right: 1px solid var(--line); }
.ydgroup { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.backbtn { white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 48px; border-radius: 12px; background: var(--green); color: #fff; font: 700 15px var(--font); text-decoration: none; text-align: center; padding: 6px 4px; line-height: 1.15; }
.backbtn:active { background: var(--green-2); }
.yd { display: grid; grid-template-columns: 18px 1fr; align-items: center; gap: 6px; }
.yd svg { width: 16px; height: 16px; }
.yd .n { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.yd.small .n { font-size: 26px; color: var(--green-2); }
.yd.big .n { font-size: 44px; }
.yd .n.long { font-size: 26px; }
.yd.small .n.long { font-size: 20px; }
.yd .k { grid-column: 2; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: -2px; }

.mapbox { position: relative; flex: 1; min-width: 0; background: var(--native); }
.mapbox svg { position: absolute; top: 0; left: 0; right: 0; bottom: 96px; width: 100%; height: calc(100% - 96px); touch-action: none; user-select: none; -webkit-user-select: none; }
.pill { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: rgba(255,255,255,.94); font-size: 13px; color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.pill .msg { flex: 1; min-width: 0; }
.pill button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font: 600 13px var(--font); color: var(--green); cursor: pointer; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); flex: none; }
.dot.ok { background: var(--ok); } .dot.fair { background: var(--fair); } .dot.poor { background: var(--poor); } .dot.sim { background: var(--you); }

.holebar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--green); color: #fff; }
.holebar button { flex: 0 0 auto; min-width: 84px; height: 44px; border: 0; border-radius: 22px; background: #fff; color: var(--green); font: 700 16px var(--font); letter-spacing: .04em; cursor: pointer; }
.holeinfo { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
.holeinfo .v { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 700; letter-spacing: .14em; }
.holeinfo .num { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.holeinfo .meta { font-size: 15px; line-height: 1.25; font-weight: 600; }
button:focus-visible { outline: 3px solid #f5c542; outline-offset: 2px; }
@media (max-width: 360px) { .col { flex-basis: 116px; } .yd.big .n { font-size: 38px; } }
</style>
</head>

<div class="app">

</div>

    for (const p of pts) { const l = q[q.length - 1]; if (Math.hypot(p.x - l.x, p.y - l.y) >= gap) q.push(p); }
    if (q.length < 4) q = pts.slice();
    for (let k = 0; k < passes; k++)
      q = q.map((p, i) => { const a = q[(i - 1 + q.length) % q.length], b = q[(i + 1) % q.length];
        return { x: (a.x + 2 * p.x + b.x) / 4, y: (a.y + 2 * p.y + b.y) / 4 }; });
    const n = q.length, f = v => v.toFixed(1);
    let d = `M${f(q[0].x)} ${f(q[0].y)}`;
    for (let i = 0; i < n; i++) {   // Catmull-Rom through every point, as cubic Beziers
      const p0 = q[(i - 1 + n) % n], p1 = q[i], p2 = q[(i + 1) % n], p3 = q[(i + 2) % n];
      d += `C${f(p1.x + (p2.x - p0.x) / 6)} ${f(p1.y + (p2.y - p0.y) / 6)} ${f(p2.x - (p3.x - p1.x) / 6)} ${f(p2.y - (p3.y - p1.y) / 6)} ${f(p2.x)} ${f(p2.y)}`;
    }
    return d + "Z";
  }
  const SM = { outline: [5, 3], water: [3, 2], green: [1.2, 1], bunker: [0.8, 1] };
  const shape = (kind, pts) => smooth(pts, SM[kind][0], SM[kind][1]);

  // Tee boxes: tap one on the map to play from it; remembered across holes.
  const TEE_COLORS = { Black: "#1c1c1c", White: "#ffffff", Gold: "#d4a52a", Silver: "#b9c0c6", Blue: "#2b6fd6", Red: "#c8372d", Yellow: "#f0c52e", Green: "#2d8a4e" };
  let teeName = store.get("yt.tee") || "White";
  function teeOf(h) {
    const T = h.drawn && h.drawn.tees;
    if (T && T.length) return (T.find(t => t.name === teeName) || T.find(t => t.name === "White") || T[0]).p;
    if (h.drawn) return h.drawn.tee;
    // no tee mapped yet: 150 yds back down the approach line
    return frame(h.center, h.front, h.back).from({ x: 0, y: 150 });
  }
  // Where distances are measured from.
  function origin(h) {
    if (mode === "practice") return { p: practice[idx] || teeOf(h), why: "practice" };
    if (!gps) return { p: null, why: "waiting" };
    if (yards(gps, h.center) > 700) return { p: teeOf(h), why: "far" };
    return { p: gps, why: "gps" };
  }

  // ---- navigation ----
  function go(i) { idx = (i + 18) % 18; store.set("yt.hole", String(idx + 1)); render(); }
  $("prev").addEventListener("click", () => go(idx - 1));
  $("next").addEventListener("click", () => go(idx + 1));
  $("vHole").addEventListener("click", () => { view = "hole"; render(); });
  $("vGreen").addEventListener("click", () => { view = "green"; render(); });
  $("modeBtn").addEventListener("click", () => {
    if (mode === "gps") { mode = "practice"; }
    else if (!gpsProblem || gpsProblem.retry) { gpsProblem = null; mode = "gps"; startGps(); }
    render();
  });

  // ---- GPS ----
  function startGps() {
    if (watchId != null) return;
    if (!("geolocation" in navigator)) return gpsFail("This browser can't share location.", false);
    try {
      watchId = navigator.geolocation.watchPosition(
        p => { gps = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy / M_PER_YD, t: Date.now() }; render(); },
        e => { if (e.code === 1) gpsFail("Location is blocked for this page. Allow it in your browser settings.", false); },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
      );
    } catch { return gpsFail("Location isn't available here.", false); }
    setTimeout(() => { if (!gps && mode === "gps" && !gpsProblem) gpsFail("No GPS fix yet.", true); }, 12000);
    keepAwake();
  }
  function gpsFail(text, retry) {
    gpsProblem = { text, retry };
    if (watchId != null) { try { navigator.geolocation.clearWatch(watchId); } catch {} watchId = null; }
    mode = "practice"; render();
  }
  let lock = null;
  async function keepAwake() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); } } catch {} }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && mode === "gps") keepAwake(); });

  // ---- map interaction: drag the target ring; tap elsewhere to stand there (practice) or to aim (GPS) ----
  let drag = null, fr = null, scale = 1;
  const svgPoint = ev => { const svg = $("map"), pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
  $("map").addEventListener("pointerdown", ev => {
    if (!fr) return;
    const s = svgPoint(ev);
    const teeHit = ev.target.closest && ev.target.closest("[data-tee]");
    if (teeHit) {
      teeName = teeHit.getAttribute("data-tee"); store.set("yt.tee", teeName);
      if (mode === "practice") delete practice[idx];
      delete target[idx]; render(); return;
    }
    if (ev.target.closest && ev.target.closest("[data-target]")) { drag = ev.pointerId; $("map").setPointerCapture(ev.pointerId); return; }
    if (view === "hole" && mode === "gps") { target[idx] = fr.from(s); render(); return; }
    if (mode === "practice") { practice[idx] = fr.from(s); delete target[idx]; render(); }
  });
  $("map").addEventListener("pointermove", ev => { if (drag === ev.pointerId) { target[idx] = fr.from(svgPoint(ev)); render(); } });
  const endDrag = ev => { if (drag === ev.pointerId) drag = null; };
  $("map").addEventListener("pointerup", endDrag); $("map").addEventListener("pointercancel", endDrag);
  window.addEventListener("resize", () => render());

  // ---- render ----
  function render() {
    const h = HOLES[idx], o = origin(h);
    if (!h.drawn && view === "hole") view = "green";
    $("vHole").disabled = !h.drawn;
    $("vHole").setAttribute("aria-pressed", String(view === "hole"));
    $("vGreen").setAttribute("aria-pressed", String(view === "green"));
    $("holeNum").textContent = h.hole;
    $("holeMeta").innerHTML = "PAR " + h.par + "<br>S.I. " + h.si;

    const fb = o.p ? frontBack(h, o.p) : null;
    $("vBack").textContent = fb ? fmt(fb.back) : "–";
    $("vCenter").textContent = o.p ? fmt(yards(o.p, h.center)) : "–";
    ["vBack", "vCenter", "vFront"].forEach(id => $(id).classList.toggle("long", $(id).textContent.length > 3));  // 4+ digits: smaller so the column keeps its width
    $("vFront").textContent = fb ? fmt(fb.front) : "–";

    const dot = $("sDot"), msg = $("sMsg"), btn = $("modeBtn"); dot.className = "dot";
    if (mode === "practice") {
      dot.classList.add("sim");
      msg.textContent = (gpsProblem ? gpsProblem.text + " " : "") + "Practice: tap the map to stand there, drag the ring to aim.";
      btn.textContent = "Use GPS"; btn.hidden = !!gpsProblem && !gpsProblem.retry;
    } else {
      btn.hidden = false; btn.textContent = "Practice";
      if (!gps) msg.textContent = "Waiting for GPS…";
      else {
        dot.classList.add(gps.acc <= 8 ? "ok" : gps.acc <= 15 ? "fair" : "poor");
        msg.textContent = o.why === "far" ? "You're " + fmt(yards(gps, h.center)) + " yds away. Showing yardages from the " + ((h.drawn && h.drawn.tees.length) ? teeName.toLowerCase() + " tees." : "tee.")
          : "GPS ±" + Math.round(gps.acc) + " yds" + (gps.acc > 15 ? ", weak signal" : "") + (view === "hole" ? ". Tap to aim." : ".");
      }
    }
    $("mapbox").style.background = view === "hole" ? "var(--native)" : "var(--rough)";
    if (view === "hole") drawHole(h, o); else drawGreen(h, o);
  }

  function setView(svg, pts, pad) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    pts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
    x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
    const box = $("map").getBoundingClientRect();
    const W = box.width || 280, H = box.height || 560;
    // fit the content, keep the box's aspect so the drawing fills the space
    let w = x1 - x0, hgt = y1 - y0;
    if (w / hgt < W / H) { const nw = hgt * W / H; x0 -= (nw - w) / 2; w = nw; } else { const nh = w * H / W; y0 -= (nh - hgt) / 2; hgt = nh; }
    svg.setAttribute("viewBox", [x0, y0, w, hgt].map(v => v.toFixed(1)).join(" "));
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    scale = hgt / H; // yards per screen pixel
    return { x0, y0, w, h: hgt };
  }

  // Woods beside the hole: pale rough with scattered trees and clumps, thicker away from the
  // fairway, each with a shadow to one side. Generated once per hole from a fixed seed, so it
  // looks the same every time and doesn't redraw while GPS updates.
  const woodsCache = {};
  function woods(hole, outline) {
    if (!woodsCache[hole]) {
      let seed = hole * 9301 + 49297;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const pick = a => a[Math.floor(rnd() * a.length)];
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      outline.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
      x0 -= 260; x1 += 260; y0 -= 120; y1 += 120;   // wide enough to fill an iPad screen
      const inside = (x, y) => { let c = false; for (let i = 0, j = outline.length - 1; i < outline.length; j = i++) {
        const a = outline[i], b = outline[j]; if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c; } return c; };
      const edge = (x, y) => { let m = Infinity; for (let i = 0, j = outline.length - 1; i < outline.length; j = i++) {
        const a = outline[j], b = outline[i], dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy || 1;
        const t = Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / L));
        m = Math.min(m, Math.hypot(x - a.x - t * dx, y - a.y - t * dy)); } return m; };
      const greens = ["#2e4d2c", "#3a5f34", "#27422a", "#456b3a", "#34552f", "#4d7340"];
      const fall = ["#8a6a34", "#93603a", "#7d6a2a", "#a07a40"];
      const patches = [], shadows = [], crowns = [];
      for (let k = 0; k < 40; k++) {   // patches of darker grass and bare dirt
        const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
        if (inside(x, y)) continue;
        patches.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(6 + rnd() * 16).toFixed(1)}" ry="${(4 + rnd() * 10).toFixed(1)}" fill="var(${rnd() < .3 ? "--dirt" : "--native-2"})" opacity="${(.35 + rnd() * .35).toFixed(2)}"/>`);
      }
      const step = 7;
      for (let gy = y0; gy < y1; gy += step) for (let gx = x0; gx < x1; gx += step) {
        const x = gx + (rnd() - .5) * step * 1.4, y = gy + (rnd() - .5) * step * 1.4;
        if (inside(x, y)) continue;
        const d = edge(x, y);
        if (d < 2.5) continue;
        const keep = d < 10 ? .22 : d < 25 ? .45 : .62;   // sparse right at the edge, thicker deeper in
        if (rnd() > keep) continue;
        const n = 1 + Math.floor(rnd() * (d < 10 ? 2 : 4));
        const autumn = rnd() < .07;
        for (let t = 0; t < n; t++) {
          const r = 2.2 + rnd() * 3.4, cx = x + (rnd() - .5) * 6, cy = y + (rnd() - .5) * 6;
          shadows.push(`<ellipse cx="${(cx + r * .55).toFixed(1)}" cy="${(cy + r * .45).toFixed(1)}" rx="${(r * 1.05).toFixed(1)}" ry="${(r * .95).toFixed(1)}"/>`);
          const col = autumn && t === 0 ? pick(fall) : pick(greens);
          crowns.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${col}"/>`,
            `<circle cx="${(cx - r * .3).toFixed(1)}" cy="${(cy - r * .3).toFixed(1)}" r="${(r * .45).toFixed(1)}" fill="#fff" opacity=".09"/>`);
        }
      }
      woodsCache[hole] = patches.join("") + `<g fill="var(--shade)" opacity=".55">${shadows.join("")}</g>` + crowns.join("");
    }
    const g = el("g", { "aria-hidden": "true", "pointer-events": "none" });
    g.innerHTML = woodsCache[hole];
    return g;
  }

  // Real trees inside the hole (traced from the photo): a shadow, a canopy, and leafy texture.
  const standsCache = {};
  function stands(hole, polys) {
    if (!standsCache[hole]) {
      let seed = hole * 7919 + 104729;
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const greens = ["#2e4d2c", "#3a5f34", "#27422a", "#456b3a", "#34552f"];
      const inPoly = (pts, x, y) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const a = pts[i], b = pts[j]; if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) c = !c; } return c; };
      let sh = "", can = "", leaves = "";
      polys.forEach(rings => {
        const pts = rings[0], gaps = rings.slice(1);
        const inStand = (x, y) => inPoly(pts, x, y) && !gaps.some(g => inPoly(g, x, y));
        const d = rings.map(r => smooth(r, 1.5, 2)).join(" ");
        const dOff = rings.map(r => smooth(r.map(p => ({ x: p.x + 1.6, y: p.y + 1.4 })), 1.5, 2)).join(" ");
        sh += `<path fill-rule="evenodd" d="${dOff}"/>`;
        can += `<path fill-rule="evenodd" d="${d}" fill="${greens[Math.floor(rnd() * greens.length)]}"/>`;
        let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
        pts.forEach(p => { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
        const n = Math.min(400, Math.round((x1 - x0) * (y1 - y0) / 9));
        for (let k = 0; k < n; k++) {
          const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
          if (!inStand(x, y)) continue;
          const r = 1.4 + rnd() * 2.6;
          leaves += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${greens[Math.floor(rnd() * greens.length)]}"/>` +
            `<circle cx="${(x - r * .3).toFixed(1)}" cy="${(y - r * .3).toFixed(1)}" r="${(r * .45).toFixed(1)}" fill="#fff" opacity=".08"/>`;
        }
      });
      standsCache[hole] = `<g fill="var(--shade)" opacity=".5">${sh}</g>${can}${leaves}`;
    }
    const g = el("g", { "aria-hidden": "true", "pointer-events": "none" });
    g.innerHTML = standsCache[hole];
    return g;
  }

  // A waterfall: a few rocks with white water spilling into the pond.
  function falls(svg, q) {
    const s = 1;
    [[-2.2, -1, 2], [1.8, -1.6, 1.7], [0, 1.6, 1.8], [-2.6, 1.6, 1.3], [2.6, 1.2, 1.3]].forEach(([dx, dy, r]) =>
      svg.appendChild(el("circle", { cx: q.x + dx * s, cy: q.y + dy * s, r: r * s, fill: "#8a8478", stroke: "#5d574c", "stroke-width": .3 })));
    svg.appendChild(el("path", { d: `M${q.x - 1.2} ${q.y - .2}q1.2 2 0 4M${q.x + .4} ${q.y - .6}q1.2 2.4 0 4.6M${q.x + 1.8} ${q.y}q1 1.8 0 3.6`, fill: "none", stroke: "#fff", "stroke-width": .55, "stroke-linecap": "round", opacity: .9 }));
  }

  function defs(svg) {
    const d = el("defs", {});
    const trees = el("pattern", { id: "trees", patternUnits: "userSpaceOnUse", width: 9 * scale * 3, height: 9 * scale * 3 });
    const s = 9 * scale;
    [[0.6,0.7,1.3,"--canopy"],[2.1,0.9,1.1,"--canopy-2"],[1.4,2.1,1.25,"--canopy"],[2.6,2.4,0.9,"--canopy-2"],[0.3,2.5,0.8,"--canopy-2"]]
      .forEach(([x,y,r,c]) => trees.appendChild(el("circle", { cx: x*s, cy: y*s, r: r*s, fill: `var(${c})` })));
    const stripes = el("pattern", { id: "mow", patternUnits: "userSpaceOnUse", width: 20, height: 20 });
    stripes.appendChild(el("rect", { x: 0, y: 0, width: 20, height: 10, fill: "var(--stripe)" }));
    d.append(trees, stripes); svg.appendChild(d);
  }

  function chip(svg, x, y, text) {
    const fs = 17 * scale, pw = (text.length * 10.5 + 18) * scale, ph = 30 * scale;
    svg.appendChild(el("rect", { x: x - pw/2, y: y - ph/2, width: pw, height: ph, rx: 6 * scale, fill: "var(--chip)", "fill-opacity": .88, stroke: "#fff", "stroke-opacity": .5, "stroke-width": scale }));
    svg.appendChild(el("text", { x, y: y + fs * 0.36, "font-size": fs, "font-weight": 700, "text-anchor": "middle", fill: "#fff", "font-family": "var(--font)", "pointer-events": "none" }, text));
  }

  function drawHole(h, o) {
    const svg = $("map"); svg.replaceChildren();
    const D = h.drawn; fr = frame(h.center, D.tee, h.center);
    const outline = D.outline.map(fr.to), green = D.green.map(fr.to), tee = fr.to(D.tee), C = fr.to(h.center);
    setView(svg, outline.concat(D.tees.map(t => fr.to(t.p))), 8);  // keep every tee box in view
    defs(svg);
    svg.appendChild(el("rect", { x: -5000, y: -5000, width: 10000, height: 10000, fill: "var(--native)" }));
    svg.appendChild(woods(h.hole, outline));
    svg.appendChild(el("path", { d: shape("outline", outline), fill: "var(--rough)", stroke: "#4f7a3a", "stroke-width": .8 }));
    svg.appendChild(el("path", { d: shape("outline", outline), fill: "url(#mow)", "fill-opacity": .55 }));
    D.water.forEach(w => svg.appendChild(el("path", { d: shape("water", w.map(fr.to)), fill: "var(--water)", stroke: "var(--water-edge)", "stroke-width": 1 })));
    if (D.trees.length) svg.appendChild(stands(h.hole, D.trees.map(t => t.map(r => r.map(fr.to)))));
    D.falls.forEach(f => falls(svg, fr.to(f)));
    D.bunkers.forEach(b => svg.appendChild(el("path", { d: shape("bunker", b.map(fr.to)), fill: "var(--bunker)", stroke: "var(--bunker-edge)", "stroke-width": .6 })));
    svg.appendChild(el("path", { d: shape("green", green), fill: "var(--putting)", stroke: "var(--putting-edge)", "stroke-width": 1 }));
    // tee boxes: one per set of tees when mapped, colored like the markers; tap to play from it
    if (D.tees.length) {
      D.tees.forEach(t => {
        const q = fr.to(t.p), on = t.name === teeName || (!D.tees.some(x => x.name === teeName) && t.name === "White");
        svg.appendChild(el("rect", { x: q.x - 7, y: q.y - 5.5, width: 14, height: 11, rx: 4, fill: "var(--rough)" }));  // mown area around the box
        svg.appendChild(el("rect", { x: q.x - 3.5, y: q.y - 2.5, width: 7, height: 5, rx: 1.2, fill: "var(--putting)", stroke: on ? "#fff" : "var(--putting-edge)", "stroke-width": on ? 1 : .5 }));
        const m = el("g", { "data-tee": t.name, style: "cursor:pointer" });
        m.appendChild(el("circle", { cx: q.x, cy: q.y, r: 9 * scale, fill: "transparent" }));
        m.appendChild(el("circle", { cx: q.x, cy: q.y, r: (on ? 5 : 3.6) * scale, fill: TEE_COLORS[t.name] || "#888", stroke: on ? "var(--you)" : "#333", "stroke-width": (on ? 2.2 : .9) * scale }));
        svg.appendChild(m);
      });
    } else {
      svg.appendChild(el("rect", { x: tee.x - 4, y: tee.y - 3, width: 8, height: 6, rx: 1.5, fill: "var(--putting)", stroke: "var(--putting-edge)", "stroke-width": .6 }));
    }

    // play line: you -> target -> pin
    const P = o.p ? fr.to(o.p) : null;
    if (P) {
      const total = yards(o.p, h.center);
      let T = target[idx] ? fr.to(target[idx]) : null;
      if (!T && total > 300) { const f = 250 / total; T = { x: P.x + (C.x - P.x) * f, y: P.y + (C.y - P.y) * f }; }
      const lw = 2.4 * scale;
      if (T) {
        const tLL = fr.from(T);
        svg.appendChild(el("polyline", { points: `${P.x},${P.y} ${T.x},${T.y} ${C.x},${C.y}`, fill: "none", stroke: "#fff", "stroke-width": lw, "stroke-linejoin": "round" }));
        const g = el("g", { "data-target": "1", style: "cursor: grab" });
        g.appendChild(el("circle", { cx: T.x, cy: T.y, r: 34 * scale, fill: "#fff", "fill-opacity": .08, stroke: "#fff", "stroke-width": lw }));
        g.appendChild(el("circle", { cx: T.x, cy: T.y, r: 5 * scale, fill: "#fff" }));
        svg.appendChild(g);
        chip(svg, (P.x + T.x) / 2, (P.y + T.y) / 2, fmt(yards(o.p, tLL)));
        chip(svg, (T.x + C.x) / 2, (T.y + C.y) / 2, fmt(yards(tLL, h.center)));
      } else {
        svg.appendChild(el("line", { x1: P.x, y1: P.y, x2: C.x, y2: C.y, stroke: "#fff", "stroke-width": lw }));
        chip(svg, (P.x + C.x) / 2, (P.y + C.y) / 2, fmt(total));
      }
      svg.appendChild(el("circle", { cx: P.x, cy: P.y, r: 15 * scale, fill: "var(--you)", "fill-opacity": .3 }));
      svg.appendChild(el("circle", { cx: P.x, cy: P.y, r: 7 * scale, fill: "#fff" }));
      svg.appendChild(el("circle", { cx: P.x, cy: P.y, r: 5 * scale, fill: "var(--you)" }));
    }
    flag(svg, C);
  }

  function flag(svg, C) {
    svg.appendChild(el("circle", { cx: C.x, cy: C.y, r: 12 * scale, fill: "var(--flag)", stroke: "#fff", "stroke-width": 2.2 * scale }));
    const s = scale;
    svg.appendChild(el("path", { d: `M${C.x - 3*s} ${C.y + 6*s}V${C.y - 6*s}l${7*s} ${2.6*s}l${-7*s} ${2.6*s}`, fill: "#fff", stroke: "#fff", "stroke-width": 1.4 * s, "stroke-linejoin": "round" }));
  }

  function drawGreen(h, o) {
    const svg = $("map"); svg.replaceChildren();
    const D = h.drawn;
    fr = frame(h.center, h.front, h.back); // approach from the bottom
    const F = fr.to(h.front), C = fr.to(h.center), B = fr.to(h.back);
    const greenPts = D ? D.green.map(fr.to) : null;
    // Frame the green and whatever sand or water sits right around it.
    const near = q => Math.hypot(q.x - C.x, q.y - C.y) < 40;
    const around = D ? D.bunkers.concat(D.water).map(b => b.map(fr.to)).flat().filter(near) : [];  // only the parts close to the green
    const ring = greenPts ? [] : [ { x: -32, y: -30 }, { x: 32, y: 40 } ];
    const core = (greenPts || [F, B]).concat(around, ring);
    const mirrored = core.map(q => ({ x: 2 * C.x - q.x, y: 2 * C.y - q.y }));   // keep the flag in the middle
    setView(svg, core.concat(mirrored), greenPts ? 12 : 6);   // room for the F and B labels
    defs(svg);
    svg.appendChild(el("rect", { x: -5000, y: -5000, width: 10000, height: 10000, fill: "var(--rough)" }));
    svg.appendChild(el("rect", { x: -5000, y: -5000, width: 10000, height: 10000, fill: "url(#mow)", "fill-opacity": .55 }));
    if (D) D.water.forEach(w => svg.appendChild(el("path", { d: shape("water", w.map(fr.to)), fill: "var(--water)", stroke: "var(--water-edge)", "stroke-width": .6 })));
    if (D) D.falls.forEach(f => falls(svg, fr.to(f)));
    if (D) D.bunkers.forEach(b => svg.appendChild(el("path", { d: shape("bunker", b.map(fr.to)), fill: "var(--bunker)", stroke: "var(--bunker-edge)", "stroke-width": .4 })));
    if (greenPts) svg.appendChild(el("path", { d: shape("green", greenPts), fill: "var(--putting)", stroke: "var(--putting-edge)", "stroke-width": .6 }));
    else {
      const depth = Math.hypot(F.x - B.x, F.y - B.y);
      svg.appendChild(el("ellipse", { cx: (F.x + B.x) / 2, cy: (F.y + B.y) / 2, rx: Math.max(13, depth * .45), ry: depth / 2 + 2.5, fill: "var(--putting)", stroke: "var(--putting-edge)", "stroke-width": .6 }));
    }
    const fbg = o.p ? frontBack(h, o.p) : null;
    const FA = fbg && fbg.frontAt ? fr.to(fbg.frontAt) : F, BA = fbg && fbg.backAt ? fr.to(fbg.backAt) : B;
    if (fbg && fbg.frontAt) {  // your line across the green
      const P = fr.to(o.p);
      svg.appendChild(el("line", { x1: P.x, y1: P.y, x2: BA.x, y2: BA.y, stroke: "#fff", "stroke-width": 1.6 * scale, "stroke-dasharray": `${4 * scale} ${4 * scale}`, "stroke-opacity": .85 }));
    }
    [["F", FA, fbg && fbg.front], ["B", BA, fbg && fbg.back]].forEach(([t, s, v]) => {
      svg.appendChild(el("circle", { cx: s.x, cy: s.y, r: 4 * scale, fill: "var(--chip)", stroke: "#fff", "stroke-width": 1.2 * scale }));
      if (v != null) {   // label outside the green, pushed away from the flag
        const dx = s.x - C.x, dy = s.y - C.y, L = Math.hypot(dx, dy) || 1;
        chip(svg, s.x + dx / L * 46 * scale, s.y + dy / L * 26 * scale, t + " " + fmt(v));
      }
    });
    flag(svg, C);
    if (o.p && yards(o.p, h.center) < 60) {
      const P = fr.to(o.p);
      svg.appendChild(el("circle", { cx: P.x, cy: P.y, r: 6 * scale, fill: "var(--you)", stroke: "#fff", "stroke-width": 2 * scale }));
    }
  }

  // The scorecard tells an already-open page which hole is being scored.
  window.addEventListener("message", ev => {
    if (ev.origin !== location.origin || !ev.data || ev.data.type !== "msg-yardage-hole") return;
    const n = parseInt(ev.data.hole, 10); if (n >= 1 && n <= 18) go(n - 1);
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") render(); });

  // Start with GPS; practice mode takes over if location isn't available.
  startGps(); render();
  setInterval(() => { if (mode === "gps" && gps && Date.now() - gps.t > 15000) render(); }, 5000);
})();
</script>
</body>
</html>
