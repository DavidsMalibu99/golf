name: GHIN index update
run-name: ${{ inputs.quick && 'Check GHIN button' || 'GHIN index update' }}

# Tuesday and Thursday nights, about 10:30 PM Central (11:30 PM during daylight time).
# Run it any time from the Actions tab: "GHIN index update" > Run workflow.
on:
  schedule:
    - cron: '30 4 * * 3,5'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database: live or dev'
        default: live
        type: choice
        options: [live, dev]
      dry_run:
        description: 'Dry run: look up only, save nothing'
        default: false
        type: boolean
      quick:
        description: 'Quick check (Check GHIN button): known GHIN numbers only, no name searches'
        default: false
        type: boolean
      probe:
        description: 'Probe only (find the Following list address; reads nothing else, saves nothing)'
        default: false
        type: boolean

concurrency: ghin-update

# contents: write is only for the keep-alive step below.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: tools/ghin-bot
        run: npm install --no-audit --no-fund
      - name: Update indexes from GHIN
        working-directory: tools/ghin-bot
        env:
          GHIN_USER: ${{ secrets.GHIN_USER }}
          GHIN_PASSWORD: ${{ secrets.GHIN_PASSWORD }}
          TARGET: ${{ inputs.target || 'live' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          QUICK: ${{ inputs.quick || 'false' }}
        run: if [ "${{ inputs.probe }}" = "true" ]; then node probe.mjs; else node update.mjs; fi
      # GitHub pauses scheduled runs on a repo with no commits for 60 days. After a night run, if the
      # last commit is over 40 days old, record the date in a small file so the schedule stays on.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' && success()
        run: |
          git fetch -q --depth=1 origin main
          last=$(git log -1 --format=%ct origin/main); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 40 ]; then
            date -u +%Y-%m-%dT%H:%MZ > tools/ghin-bot/keepalive.txt
            git config user.name "GHIN bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/ghin-bot/keepalive.txt
            git commit -m "GHIN bot keep-alive (no commits for 40+ days)"
            git push origin HEAD:main
          else
            echo "Last commit $(( (now - last) / 86400 )) days ago; nothing to do."
          fi
